<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Admin - Asignar Casas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <style>
    #map { height: 80vh; width: 100%; }
    .panel { padding: 10px; text-align: center; margin-bottom: 10px; }
    .panel > * { margin: 5px; }
    .leaflet-tooltip.usuario-label {
      background-color: rgba(255,255,255,0.8);
      border: 1px solid #ccc;
      padding: 2px 6px;
      font-size: 12px;
      border-radius: 4px;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
  </style>
</head>
<body>
  <div class="panel container d-flex justify-content-center flex-wrap gap-2">
    <input type="text" id="usuarioAsignar" class="form-control" placeholder="Usuario a asignar" style="max-width: 250px;" />
    <div id="fechaAsignacionWrap" class="d-flex" style="width: 150px;">
  <input type="text" id="fechaAsignacion" data-input class="form-control form-control-sm" placeholder="Fecha">
</div>


    <button id="btnAsignar" class="btn btn-primary">Asignar</button>
    <button id="btnDesasignar" class="btn btn-warning">Desasignar seleccionadas</button>
    <button id="btnToggleVisitadas" class="btn btn-secondary">Ocultar visitadas</button>
    <button id="btnVerEstadisticas" class="btn btn-info">Ver estadísticas</button>
    <button id="btnToggleSatelite" class="btn btn-outline-secondary">Mapa Satelital</button>
    <button id="btnModoEdicion" class="btn btn-outline-secondary">Modo edición</button>
    <input type="text" id="filtroUsuario" class="form-control" placeholder="Filtrar por usuario" style="max-width: 200px;" />
  </div>
  <div id="map" class="container-fluid px-0"></div>
  <!-- Modal Historial -->
<div class="modal fade" id="historialModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Historial de la casa</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="historialContenido">
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script>

    // ================== MISION DESDE URL ==================
const params = new URLSearchParams(window.location.search);
const MISION = params.get("mision");

if (!MISION) {
  alert("⚠️ Falta el parámetro ?mision= en la URL");
  throw new Error("Misión no especificada");
}

async function centrarMapa(nombreMision) {
  try {
    const res = await fetch(`/centro?nombre=${encodeURIComponent(nombreMision)}`);
    const data = await res.json();

    if (!res.ok) {
      mapa.setView([-31.426512, -64.176008], 16);
      console.error(data.error);
      return;
    }

    const lat = parseFloat(data.latitud);
    const lon = parseFloat(data.longitud);

    mapa.setView([lat, lon], 16);

  } catch (err) {
    mapa.setView([-31.426512, -64.176008], 16);
    console.error("Error obteniendo centro:", err);
  }
}
centrarMapa(MISION);

// ======================================================


    flatpickr("#fechaAsignacionWrap", {
  wrap: true,
  dateFormat: "Y-m-d",
  altInput: true,
  altFormat: "d/m/Y",
  allowInput: false,
});



  const estadoColores = {
    visitada: 'green',
    no_atendieron: 'orange',
    otro: 'gray',
    peregrina: 'blue',
    volver: 'red'
  };

  const coloresUsuarios = {};
  const coloresDisponibles = [
    '#e6194b', '#3cb44b', '#ffe119', '#4363d8', '#f58231',
    '#911eb4', '#46f0f0', '#f032e6', '#bcf60c', '#fabebe',
    '#008080', '#e6beff', '#9a6324', '#fffac8', '#800000'
  ];

  function getColorUsuario(usuario) {
    if (!usuario) return 'black';
    if (!coloresUsuarios[usuario]) {
      coloresUsuarios[usuario] = coloresDisponibles[Object.keys(coloresUsuarios).length % coloresDisponibles.length];
    }
    return coloresUsuarios[usuario];
  }

  const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '© OpenStreetMap'
  });

  const satelite = L.tileLayer('https://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
    maxZoom: 19, subdomains: ['mt0', 'mt1', 'mt2', 'mt3'], attribution: '© Google'
  });

  const mapa = L.map('map', {
    zoom: 15,
    layers: [osm],
    closePopupOnClick: true,
  });

  const drawnItems = new L.FeatureGroup();
  mapa.addLayer(drawnItems);

  let capaSateliteActiva = false;
  let marcadores = [];
  let tooltips = [];
  let seleccionadas = new Set();
  let mostrarVisitadas = true;
  let usuarioFiltro = "";

  const drawControl = new L.Control.Draw({
    draw: {
      rectangle: true,
      polygon: true,
      circle: false,
      marker: false,
      circlemarker: false,
      polyline: false
    },
    edit: { featureGroup: drawnItems, edit: false, remove: false }
  });
  mapa.addControl(drawControl);

  mapa.on('draw:created', function (e) {
    const layer = e.layer;
    drawnItems.clearLayers();
    drawnItems.addLayer(layer);
    seleccionadas.clear();
    marcadores.forEach(marker => {
      if (layer.getBounds().contains(marker.getLatLng())) {
        seleccionadas.add(marker.options.casaId);
        marker.setStyle({ weight: 4 });
      } else {
        marker.setStyle({ weight: marker.options.asignado ? 2 : 1 });
      }
    });
  });

  document.getElementById('btnToggleSatelite').addEventListener('click', () => {
    if (capaSateliteActiva) {
      mapa.removeLayer(satelite);
      mapa.addLayer(osm);
      document.getElementById('btnToggleSatelite').innerText = "Mapa Satelital";
    } else {
      mapa.removeLayer(osm);
      mapa.addLayer(satelite);
      document.getElementById('btnToggleSatelite').innerText = "Mapa Normal";
    }
    capaSateliteActiva = !capaSateliteActiva;
  });

  document.getElementById('btnAsignar').addEventListener('click', async () => {
  const usuario = document.getElementById('usuarioAsignar').value.trim();
  const fecha = document.getElementById('fechaAsignacion').value.trim(); // 🆕
  
  if (!usuario || !fecha || seleccionadas.size === 0) {
    return alert('Faltan datos: usuario, fecha o casas seleccionadas');
  }

  const res = await fetch('/asignar', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      usuario,
      fecha,              
      ids: [...seleccionadas]
    })
  });

  if (res.ok) {
    alert('Casas asignadas');
    seleccionadas.clear();
    cargarCasas();
  } else {
    alert('Error al asignar');
  }
});


  document.getElementById('btnDesasignar').addEventListener('click', async () => {
    if (seleccionadas.size === 0) return alert('No hay casas seleccionadas');
    if (!confirm('¿Seguro que querés desasignar y borrar estado y comentario?')) return;
    const res = await fetch('/desasignar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ids: [...seleccionadas] })
    });
    if (res.ok) {
      alert('Casas desasignadas');
      seleccionadas.clear();
      cargarCasas();
    } else {
      alert('Error al desasignar');
    }
  });

  document.getElementById('btnToggleVisitadas').addEventListener('click', () => {
    mostrarVisitadas = !mostrarVisitadas;
    document.getElementById('btnToggleVisitadas').innerText = mostrarVisitadas ? 'Ocultar visitadas' : 'Mostrar visitadas';
    cargarCasas();
  });

  document.getElementById('btnVerEstadisticas').addEventListener('click', () => {
    window.location.href = `/estadisticas.html?mision=${encodeURIComponent(MISION)}`;
  });



  document.getElementById('btnModoEdicion').addEventListener('click', () => {
    window.location.href = `/editar.html?mision=${encodeURIComponent(MISION)}`;
  });


  document.getElementById('filtroUsuario').addEventListener('input', e => {
    usuarioFiltro = e.target.value.trim().toLowerCase();
    cargarCasas();
  });

  function ocultarTooltips() {
    document.querySelectorAll('.usuario-label').forEach(label => {
      label.style.opacity = '0';
      setTimeout(() => label.style.opacity = '1', 1000);
    });
  }

  mapa.getContainer().addEventListener('pointermove', ocultarTooltips);


  async function cargarCasas() {
    const res = await fetch(`/casas?mision=${encodeURIComponent(MISION)}`);
    const casas = await res.json();

    marcadores.forEach(m => mapa.removeLayer(m));
    tooltips.forEach(t => mapa.removeLayer(t));
    marcadores = [];
    tooltips = [];

    const filtradas = casas.filter(c => {
      const visible = mostrarVisitadas || (c.estado !== 'visitada' && c.estado !== 'volver' && c.estado !== 'peregrina');
      const coincideUsuario = !usuarioFiltro || (c.asignado_a || '').toLowerCase().includes(usuarioFiltro);
      return visible && coincideUsuario;
    });

    const porUsuario = {};

    filtradas.forEach(casa => {
      const color = estadoColores[casa.estado] || 'gray';
      const borde = getColorUsuario(casa.asignado_a);

      const marker = L.circleMarker([casa.latitud, casa.longitud], {
        radius: 8,
        color: borde,
        fillColor: color,
        fillOpacity: 0.8,
        weight: casa.asignado_a ? 2 : 1,
        casaId: casa.id,
        asignado: !!casa.asignado_a,
      }).addTo(mapa);

      function toLocalDate(fechaStr) {
          if (!fechaStr) return '(sin fecha)';

          // Tomamos únicamente la parte "AAAA-MM-DD"
          const soloFecha = fechaStr.split('T')[0];

          const [year, month, day] = soloFecha.split('-');
          return `${day}/${month}/${year}`;
        }

        const fechaFormateada = toLocalDate(casa.fecha_asignacion);



      marker.on('click', () => {

        // 🟢 Si está visitada → mostrar historial
        if ((casa.estado != 'otro') && casa.historial && casa.historial.length > 0) {

          const cont = document.getElementById('historialContenido');

          const historialOrdenado = [...casa.historial]
            .sort((a, b) => new Date(b.fecha) - new Date(a.fecha));

          cont.innerHTML = `
     <h6>
        <span id="dir-text-${casa.id}">${casa.direccion || 'Sin dirección'}</span>
        <span id="edit-${casa.id}" style="cursor:pointer;margin-left:6px;">✏️</span>
      </h6>

      <input 
        id="dir-input-${casa.id}" 
        class="form-control form-control-sm mt-2"
        value="${casa.direccion || ''}"
        style="display:none"
      />
      <small class="text-muted" id="dir-help-${casa.id}" style="display:none">
        Enter para guardar
      </small>
      ${historialOrdenado.map(h => `
        <div class="mb-3 p-2 border rounded">
          <b>Usuario:</b> ${h.usuario || '—'}<br>
          <b>Estado:</b> ${h.estado}<br>
          <b>Comentario:</b> ${h.comentario || '(sin comentario)'}<br>
          <small class="text-muted">${new Date(h.fecha).toLocaleString()}</small>
        </div>
      `).join('')}
    `;
          setTimeout(() => {

            const edit = document.getElementById(`edit-${casa.id}`);
      const text = document.getElementById(`dir-text-${casa.id}`);
      const input = document.getElementById(`dir-input-${casa.id}`);
      const help = document.getElementById(`dir-help-${casa.id}`);

      text.ondblclick = edit.onclick;

      if (!edit) return;

      edit.onclick = () => {

        text.style.display = "none";
        edit.style.display = "none";

        input.style.display = "block";
        help.style.display = "block";

        input.focus();
        input.select();
      };

      input.addEventListener('keydown', async (e) => {

        if (e.key === 'Enter') {

          const nuevaDireccion = input.value.trim();

          try {

            const res = await fetch('/actualizar_direccion', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                id: casa.id,
                direccion: nuevaDireccion
              })
            });

            if (res.ok) {

              casa.direccion = nuevaDireccion;

              text.textContent = nuevaDireccion || "Sin dirección";

              input.style.display = "none";
              help.style.display = "none";

              text.style.display = "inline";
              edit.style.display = "inline";

              text.style.color = "green";

              setTimeout(() => text.style.color = "", 800);

            } else {
              alert("Error guardando dirección");
            }

          } catch (err) {
            console.error(err);
            alert("Error de conexión");
          }

        }

      });

    }, 100);

    const modal = new bootstrap.Modal(document.getElementById('historialModal'));
    modal.show();

  } else {

    // 🔵 Popup editable
    marker.bindPopup(`
      <div style="min-width:200px">
        <label><b>Nombre</b></label>
        <br>
                <span id="dir-text-${casa.id}">${casa.direccion || 'Sin dirección'}</span>
        <span id="edit-${casa.id}" style="cursor:pointer;margin-left:6px;">✏️</span>
    

      <input 
        id="dir-input-${casa.id}" 
        class="form-control form-control-sm mt-2"
        value="${casa.direccion || ''}"
        style="display:none"
      />
      <small class="text-muted" id="dir-help-${casa.id}" style="display:none">
        Enter para guardar
      </small>
      <hr>

        Estado: ${casa.estado || '(sin estado)'}<br>
        Asignado a: ${casa.asignado_a || 'nadie'}
      </div>
    `, { autoClose: false }).openPopup();

    setTimeout(() => {

      const edit = document.getElementById(`edit-${casa.id}`);
      const text = document.getElementById(`dir-text-${casa.id}`);
      const input = document.getElementById(`dir-input-${casa.id}`);
      const help = document.getElementById(`dir-help-${casa.id}`);

      text.ondblclick = edit.onclick;

      if (!edit) return;

      edit.onclick = () => {

        text.style.display = "none";
        edit.style.display = "none";

        input.style.display = "block";
        help.style.display = "block";

        input.focus();
        input.select();
      };

      input.addEventListener('keydown', async (e) => {

        if (e.key === 'Enter') {

          const nuevaDireccion = input.value.trim();

          try {

            const res = await fetch('/actualizar_direccion', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                id: casa.id,
                direccion: nuevaDireccion
              })
            });

            if (res.ok) {

              casa.direccion = nuevaDireccion;

              text.textContent = nuevaDireccion || "Sin dirección";

              input.style.display = "none";
              help.style.display = "none";

              text.style.display = "inline";
              edit.style.display = "inline";

              text.style.color = "green";

              setTimeout(() => text.style.color = "", 800);

            } else {
              alert("Error guardando dirección");
            }

          } catch (err) {
            console.error(err);
            alert("Error de conexión");
          }

        }

      });

    }, 100);

  }

});

      if (casa.asignado_a) {
        if (!porUsuario[casa.asignado_a]) porUsuario[casa.asignado_a] = [];
        porUsuario[casa.asignado_a].push([casa.latitud, casa.longitud]);
      }

      marcadores.push(marker);
    });

    for (const [usuario, coords] of Object.entries(porUsuario)) {
      const centro = coords.reduce((acc, c) => [acc[0]+c[0], acc[1]+c[1]], [0,0]).map(x => x / coords.length);
      const tooltip = L.tooltip({
        permanent: true,
        direction: 'top',
        className: 'usuario-label'
      })
      .setLatLng(centro)
      .setContent(usuario)
      .addTo(mapa);
      tooltips.push(tooltip);
    }

  }
  cargarCasas();
  setInterval(() => {

    // si hay un popup abierto no recargamos
    if (mapa._popup && mapa._popup.isOpen()) {
      return;
    }

    cargarCasas();

  }, 5000);
</script>
</body>
</html>
